name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: rust (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
    env:
      DATABASE_URL: postgres://chirpstack_test:chirpstack_test@localhost/chirpstack_test?sslmode=disable
      TEST_POSTGRESQL_DSN: postgres://chirpstack_test:chirpstack_test@localhost/chirpstack_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost/1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.database }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.database }}-

      - name: Start postgres and redis
        run: docker compose up -d postgres redis

      - name: Wait for postgres to accept connections
        run: |
          for _ in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U chirpstack_test -d chirpstack_test && break
            sleep 1
          done

      - name: Install diesel_cli
        run: cargo install diesel_cli --no-default-features --features postgres,sqlite

      - name: Run postgres migrations
        working-directory: chirpstack
        run: diesel --config-file diesel_postgres.toml migration --migration-dir migrations_postgres run

      - name: make test (DATABASE=${{ matrix.database }})
        working-directory: chirpstack
        env:
          DATABASE: ${{ matrix.database }}
        run: make test

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-grpc-web
        run: |
          curl -fsSL -o /usr/local/bin/protoc-gen-grpc-web \
            https://github.com/grpc/grpc-web/releases/download/2.0.2/protoc-gen-grpc-web-2.0.2-linux-x86_64
          chmod +x /usr/local/bin/protoc-gen-grpc-web

      - name: Generate grpc-web bindings
        working-directory: api/grpc-web
        run: make

      - name: Build UI
        working-directory: ui
        run: make build
